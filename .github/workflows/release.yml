name: Prepare Release (draft)

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build-cli

            - name: Run tests
              run: npm test

            - name: Create release draft
              id: create_release
              uses: actions/create-release@v1
              with:
                  tag_name: ${{ github.ref_name || 'manual-' + github.run_id }}
                  release_name:
                      'Release ${{ github.ref_name || github.run_id }}'
                  draft: true
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload dist as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
