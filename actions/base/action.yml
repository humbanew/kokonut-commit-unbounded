name: kambler
description: A enhanced review commit messages for your repository.
author: humbanew

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: aperture
  color: green

# Define your inputs here.
inputs:
  github_token:
    description: GitHub token to access the repository.
    required: true
    default: ${{ github.token }}
  agent_token:
    description: Token for the Hugging Face API.
    required: true
    default: ''
  agent_model:
    description: The AI model to use (list of 55 models).
    required: false
    default: gpt-4
  fail_on_invalid_commit:
    description: Whether to fail the action if an invalid commit message is found.
    required: false
    default: true
  auto_update_commit_msgs:
    description: Whether to automatically update all commit messages. When false, push pr with suggestions.
    required: false
    default: false
  only_enhance_commits:
    description: Whether to only enhance commits that are already valid.
    required: false
    default: false
  max_commits_scan:
    description: Maximum number of commits to process in the pull request.
    required: false
    default: 20
  # review_pull_request:
