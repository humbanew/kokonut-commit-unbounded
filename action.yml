name: Kokonut Commit
description: Enhanced review of commit messages for your repository.
author: humbanew

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
    icon: aperture
    color: green

# Define your inputs here.
inputs:
    isGoogleGemini:
        description: Set to true if a Google Gemini token is used.
        required: false
        default: false
    isOpenAIChatGPT:
        description: Set to true if an OpenAI ChatGPT token is used.
        required: false
        default: false
    isAnthropicClaude:
        description: Set to true if an Anthropic Claude token is used.
        required: false
        default: false
    isMistralLeChat:
        description: Set to true if a Mistral Le Chat token is used.
        required: false
        default: false
    isDeepseek:
        description: Set to true if a Deepseek token is used.
        required: false
        default: false
    isGrok:
        description: Set to true if a Grok token is used.
        required: false
        default: false
    isHuggingFace:
        description: Set to true if a Hugging Face token is used.
        required: false
        default: false
    commitPreset:
        description: Commit message preset to use for the repository.
        required: false
        default: 'default'
    dryRun:
        description: Generate preview outputs without creating PR comments.
        required: false
        default: 'false'
    aiTokenApi:
        description: The token from your selected artificial intelligence API.
        required: true
        default: ''
    githubTokenApi:
        description: The token from GitHub API.
        required: true
        default: ''
    autoRenameCommits:
        description: Enable automatic commit renaming using AI.
        required: false
        default: 'false'
    includeEmojis:
        description: Include emojis in AI-generated commit messages.
        required: false
        default: 'false'
    commitPrefix:
        description:
            Custom prefix to add before commit messages (e.g., 'JIRA-123').
        required: false
        default: ''
    topK:
        description:
            Controls diversity via filtering to only top K options (higher =
            more creative).
        required: false
        default: '20'
    topP:
        description:
            Controls diversity via nucleus sampling (0-1, higher = more
            creative).
        required: false
        default: '0.9'
    renameMode:
        description:
            'Rename mode: "pr" (suggest in PR comment) or "force" (force commit
            with new messages).'
        required: false
        default: 'pr'

# Define your outputs here.
outputs:
    renamedCommits:
        description: Number of commits that were renamed
    improvedMessages:
        description: List of improved commit messages
    prCommentUrl:
        description: URL of the PR comment with suggestions (when using PR mode)
    confidenceSummary:
        description: Heuristic confidence summary for the generated suggestions
    previewSuggestions:
        description: Preview-only suggestions when dryRun is enabled

# Define the runtime environment for your action here.
runs:
    using: node24
    main: dist/index.js
