name: Kokonut Commit
description: A enhanced review commit messages for your repository.
author: humbanew

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
    icon: aperture
    color: green

# Define your inputs here.
inputs:
    isGoogleGemini:
        description: Confirm if the Google Gemini token been used.
        require: false
        default: false
    isOpenAIChatGPT:
        description: Confirm if the OpenAI ChatGPT token been used.
        require: false
        default: false
    isAnthropicClaude:
        description: Confirm if the Anthropic Claude token been used.
        require: false
        default: false
    isMistralLeChat:
        description: Confirm if the Mistral Le Chat token been used.
        require: false
        default: false
    aiTokenApi:
        description: The token from your selected artificial intelligence api.
        require: true
        default: ''
    githubTokenApi:
        description: The token from Github api.
        require: true
        default: ''
    autoRenameCommits:
        description: Enable automatic commit renaming using AI.
        require: false
        default: 'false'
    includeEmojis:
        description: Include emojis in AI-generated commit messages.
        require: false
        default: 'false'
    commitPrefix:
        description:
            Custom prefix to add before commit messages (e.g., 'JIRA-123').
        require: false
        default: ''
    topK:
        description:
            Controls diversity via filtering to only top K options (higher =
            more creative).
        require: false
        default: '20'
    topP:
        description:
            Controls diversity via nucleus sampling (0-1, higher = more
            creative).
        require: false
        default: '0.9'
    renameMode:
        description:
            'Rename mode: "pr" (suggest in PR comment) or "force" (force commit
            with new messages).'
        require: false
        default: 'pr'

# Define your outputs here.
outputs:
    renamedCommits:
        description: Number of commits that were renamed
    improvedMessages:
        description: List of improved commit messages
    prCommentUrl:
        description: URL of the PR comment with suggestions (when using PR mode)

# Define the runtime environment for your action here.
runs:
    using: node24
    main: dist/index.js
